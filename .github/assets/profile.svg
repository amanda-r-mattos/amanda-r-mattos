<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1180" viewBox="0 0 900 1180" role="img" aria-labelledby="title desc">
<title id="title">Perfil GitHub de Amanda Mattos</title>
<desc id="desc">Painel animado com tecnologias, inteligência artificial, automação e projetos.</desc>
<style>
<![CDATA[
  text {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  }
  .eyebrow { font-size: 12px; font-weight: 800; letter-spacing: 5px; fill: #f472b6; }
  .name { font-size: 58px; font-weight: 900; letter-spacing: 3px; fill: #ffffff; }
  .role { font-size: 15px; font-weight: 800; letter-spacing: 4px; fill: #c084fc; }
  .bio { font-size: 13.5px; font-weight: 500; fill: #cbd5e1; }
  .muted { font-size: 10px; font-weight: 700; letter-spacing: 2px; fill: #94a3b8; }
  
  .section-title { font-size: 12px; font-weight: 900; letter-spacing: 3.5px; fill: #f472b6; }
  
  .chip { fill: #1e1b4b; fill-opacity: 0.75; stroke-width: 1.2; stroke-opacity: 0.8; }
  .chipText { font-size: 10px; font-weight: 800; letter-spacing: 1px; }
  
  .panel { fill: #131127; fill-opacity: 0.9; stroke: #2e2854; stroke-width: 1.5; }
  .panel-highlight { fill: #181530; stroke: #433878; }
  
  .card-title { font-size: 15px; font-weight: 800; fill: #fdf2f8; }
  .card-desc { font-size: 11px; font-weight: 500; fill: #94a3b8; line-height: 1.4; }
  .card-tag { font-size: 9px; font-weight: 800; fill: #f472b6; letter-spacing: 1.5px; }
  
  .stat-num { font-size: 26px; font-weight: 900; fill: #ffffff; }
  .stat-label { font-size: 9px; font-weight: 800; letter-spacing: 1.5px; fill: #cbd5e1; }
  
  .orbA { animation: floatOrbA 10s ease-in-out infinite; }
  .orbB { animation: floatOrbB 12s ease-in-out infinite; }
  .orbC { animation: floatOrbC 9s ease-in-out infinite; }
  .pulse { animation: pulseGlow 2.5s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  .scan { animation: scanline 6s linear infinite; }
  .sparkle { animation: sparkleTwinkle 3s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }

  @keyframes floatOrbA {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(30px, -15px) scale(1.1); }
  }
  @keyframes floatOrbB {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(-35px, 20px) scale(1.08); }
  }
  @keyframes floatOrbC {
    0%, 100% { transform: translate(0, 0); }
    50% { transform: translate(20px, 25px); }
  }
  @keyframes pulseGlow {
    0%, 100% { transform: scale(1); opacity: 0.85; }
    50% { transform: scale(1.45); opacity: 1; }
  }
  @keyframes scanline {
    0% { transform: translateX(-400px); }
    100% { transform: translateX(1100px); }
  }
  @keyframes sparkleTwinkle {
    0%, 100% { opacity: 0.3; transform: scale(0.8) rotate(0deg); }
    50% { opacity: 1; transform: scale(1.2) rotate(45deg); }
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; }
  }
]]>
</style>

<defs>
  <!-- Gradients -->
  <radialGradient id="gradPink"><stop stop-color="#ec4899" stop-opacity="0.5"/><stop offset="1" stop-color="#ec4899" stop-opacity="0"/></radialGradient>
  <radialGradient id="gradPurple"><stop stop-color="#8b5cf6" stop-opacity="0.45"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/></radialGradient>
  <radialGradient id="gradCyan"><stop stop-color="#06b6d4" stop-opacity="0.35"/><stop offset="1" stop-color="#06b6d4" stop-opacity="0"/></radialGradient>
  
  <linearGradient id="scanGradient" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#f472b6" stop-opacity="0"/>
    <stop offset="50%" stop-color="#c084fc" stop-opacity="0.5"/>
    <stop offset="100%" stop-color="#f472b6" stop-opacity="0"/>
  </linearGradient>

  <!-- Cute Grid Pattern -->
  <pattern id="cuteGrid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M40 0H0V40" fill="none" stroke="#6366f1" stroke-opacity="0.08" stroke-width="1"/>
    <circle cx="40" cy="40" r="1" fill="#f472b6" fill-opacity="0.25"/>
  </pattern>
</defs>

<!-- Background Frame -->

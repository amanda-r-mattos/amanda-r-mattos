<!-- Ambient Glowing Orbs -->
<ellipse class="orbA" cx="220" cy="140" rx="260" ry="160" fill="url(#gradPink)"/>
<ellipse class="orbB" cx="700" cy="170" rx="250" ry="150" fill="url(#gradPurple)"/>
<ellipse class="orbC" cx="450" cy="420" rx="280" ry="160" fill="url(#gradCyan)"/>

<!-- Scan Light Animation -->
<rect class="scan" x="-300" y="110" width="300" height="48" fill="url(#scanGradient)"/>

<!-- Sparkles / Cute Stars -->
<g class="sparkle" style="transform-origin: 120px 80px;">
